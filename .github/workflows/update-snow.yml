name: Weekly snow data update

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: snow-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest snow data (Open-Meteo)
        run: python3 scripts/update_snow.py --pause 1.0

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snow.json data/cache
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly snow data update ($(date -u +%Y-%m-%d))"
            git push
          fi
